<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meal Prep</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2c7653">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600&display=swap">
<style>
html{padding-top:env(safe-area-inset-top,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout: single phone column, day strip on top, meal cards, fixed bottom tab bar */
:root{
  --bg:#f2f5f2;--surface:#ffffff;--ink:#17201a;--muted:#5d6a62;--line:#dbe2dc;
  --accent:#2c7653;--accent-ink:#ffffff;--accent-soft:#e1efe6;
  --out:#a95d18;--out-soft:#f6e8d8;
  --font-d:'Space Grotesk',ui-sans-serif,system-ui,sans-serif;
  --font-b:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1310;--surface:#171d19;--ink:#e5ebe6;--muted:#95a29a;--line:#29322c;
  --accent:#5cbf8d;--accent-ink:#0b1810;--accent-soft:#1b3125;--out:#e8a463;--out-soft:#3a2917;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1310;--surface:#171d19;--ink:#e5ebe6;--muted:#95a29a;--line:#29322c;
  --accent:#5cbf8d;--accent-ink:#0b1810;--accent-soft:#1b3125;--out:#e8a463;--out-soft:#3a2917;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:12px calc(84px + env(safe-area-inset-bottom,0px));font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--font-d);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:24px;letter-spacing:-.01em}
h2{font-size:17px}
h3{font-size:15px}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.navbtns{display:flex;gap:6px}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
.icon-btn:disabled{opacity:.35;cursor:default}
.strip{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.day{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 0;display:flex;flex-direction:column;align-items:center;cursor:pointer;gap:1px}
.day .dw{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.day .dn{font-family:var(--font-d);font-size:16px;font-weight:600}
.day .dot{width:5px;height:5px;border-radius:50%;background:transparent}
.day.prep .dot{background:var(--accent)}
.day.today .dn{color:var(--accent)}
.day.sel{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.sel .dw,.day.sel .dn{color:var(--accent-ink)}
.day.sel .dot{background:var(--accent-ink)}
.total{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.total b{font-family:var(--font-d);font-size:18px}
.note{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:14px;display:flex;flex-direction:column;gap:4px}
.note.cta{flex-direction:row;justify-content:space-between;align-items:center;gap:10px}
.link-btn{background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;white-space:nowrap}
.meal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.meal.fixed{padding:10px 14px;gap:2px}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.meal-t{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.kc{font-size:12px;color:var(--muted)}
.meal-name{font-family:var(--font-d);font-size:17px;font-weight:600}
.comp{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
.comp li{display:grid;grid-template-columns:72px 1fr;gap:8px}
.comp .q{font-weight:600;text-align:right}
.add{font-size:13px;color:var(--muted)}
.add b{color:var(--ink);font-weight:500}
.toggle{align-self:flex-start;border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.toggle[aria-pressed="true"]{background:var(--out-soft);border-color:var(--out);color:var(--out);font-weight:600}
.meal.skipped .meal-name,.meal.skipped .comp,.meal.skipped .add{opacity:.4;text-decoration:line-through}
.out-label{font-size:13px;color:var(--out)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sec-t{display:flex;justify-content:space-between;align-items:baseline}
.row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.row label{display:flex;flex:1;gap:10px;min-width:0;cursor:pointer}
.row .nm{flex:1;min-width:0}
.row .for{display:block;font-size:12px;color:var(--muted)}
.row .amt{font-weight:600;white-space:nowrap;text-align:right}
.row.done .nm,.row.done .amt{opacity:.4;text-decoration:line-through}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.progress{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);transition:width .2s}
.ghost{border:1px solid var(--line);background:transparent;border-radius:9px;padding:7px 12px;font-size:13px;cursor:pointer;color:var(--muted);align-self:flex-start}
.step{display:flex;flex-direction:column;gap:6px}
.step ul,.step ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
details summary{cursor:pointer;font-weight:600;font-size:14px;color:var(--accent)}
details[open] summary{margin-bottom:6px}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:5}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tab{border:0;background:transparent;border-radius:10px;padding:8px 0;font-weight:600;font-size:14px;cursor:pointer;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:20px;height:20px}
.tab[aria-selected="true"]{color:var(--accent);background:var(--accent-soft)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <section id="v-today"></section>
  <section id="v-shop" hidden></section>
  <section id="v-prep" hidden></section>
</div>

<nav class="tabbar" aria-label="Views">
  <div class="in" role="tablist">
    <button class="tab" role="tab" id="t-today" data-view="today" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Today</button>
    <button class="tab" role="tab" id="t-shop" data-view="shop" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 4h2l2.4 11.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.5L21 8H6.2"/><circle cx="10" cy="20.5" r="1.3"/><circle cx="17" cy="20.5" r="1.3"/></svg>Shop</button>
    <button class="tab" role="tab" id="t-prep" data-view="prep" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 11h16v3a6 6 0 0 1-6 6h-4a6 6 0 0 1-6-6z"/><path d="M2 11h20M9 7c0-1.5 1-2 1-3.5M14 7c0-1.5 1-2 1-3.5"/></svg>Prep</button>
  </div>
</nav>

<script>

const S={meat:'Meat & fish',veg:'Veg & fruit',chilled:'Dairy, eggs & chilled',dry:'Rice, tins & dry',frozen:'Frozen'};

/* ---------- storage ---------- */
const KEY='mealprep.v1';
let store={skip:{},chk:{}};
try{const r=localStorage.getItem(KEY);if(r){const p=JSON.parse(r);store={skip:p.skip||{},chk:p.chk||{}}}}catch(e){}

/* ---------- plan logic ---------- */
const weekIdx=sun=>((Math.floor(diff(sun,ANCHOR)/7)%3)+3)%3;
const isSessionDay=d=>(d.getDay()===0||d.getDay()===3)&&sod(d)>=START;
const nextSession=d=>add(d,d.getDay()===0?3:4);
const prevSession=d=>add(d,d.getDay()===0?-4:-3);
const shopDate=d=>d.getDay()===0?add(d,-1):sod(d);

function session(date){
  date=sod(date);
  if(!isSessionDay(date))return null;
  const type=date.getDay()===0?'sun':'wed';
  const sun=type==='sun'?date:add(date,-3);
  const w=WEEKS[weekIdx(sun)];
  const idx=type==='sun'?[0,1,2]:[3,4,5];
  const bowls=idx.map((bi,i)=>{const day=add(date,i+1);return {...w.bowls[bi],day,key:iso(day)+'|lunch'}});
  const extras=[];
  if(iso(date)==='2026-11-25'){const day=D(2026,11,26);extras.push({...QUICK.friedrice,day,key:iso(day)+'|dinner'})}
  return {date,type,week:weekIdx(sun)+1,bowls,potKey:type==='sun'?w.sunPot:w.wedPot,
    potNights:[date,add(date,2)],tray:type==='sun'?w.sunTray:w.wedTray,extras};
}
/* Carry-over model: every prep cooks the normal amount (3 bowls, 3 pot portions).
   A meal marked "eating out" leaves its box/portion over; it goes to the freezer and
   fills the first slots of the next prep, which then cooks that much less. */
const firstSession=(d,strict)=>{let s=START;while(strict?s<=d:s<d)s=nextSession(s);return s};
let SIM={res:{},byKey:{}};
function buildSim(horizon){
  const res={},byKey={},pendL=[],pendD=[];
  const take=(q,id)=>{const out=[];for(let i=0;i<q.length;)if(q[i].target===id)out.push(q.splice(i,1)[0]);else i++;return out};
  for(let sd=START;sd<=horizon;sd=nextSession(sd)){
    const s=session(sd),id=iso(sd),nx=iso(nextSession(sd));
    const inL=take(pendL,id),inD=take(pendD,id);
    inL.slice(3).forEach(x=>pendL.push({...x,target:nx}));
    inD.slice(3).forEach(x=>pendD.push({...x,target:nx}));
    const lunch=s.bowls.map((b,i)=>{const lo=inL[i];
      return lo?{...lo.bowl,day:b.day,key:b.key,leftover:{from:lo.from,tray:lo.tray}}:{...b,leftover:null,tray:s.tray}});
    const nD=Math.min(inD.length,3);
    const dinner=[sd,add(sd,2),add(sd,s.type==='sun'?4:5)].map((d,i)=>{const lo=inD[i-(3-nD)];
      return {date:d,key:iso(d)+'|dinner',potKey:lo?lo.potKey:s.potKey,leftover:lo?{from:lo.from}:null,frozen:i===2}});
    const r={s,lunch,dinner,inL:inL.slice(0,3),inD:inD.slice(0,nD)};
    res[id]=r;
    lunch.forEach(sl=>{byKey[sl.key]={slot:sl,r};
      if(isSkip(sl.key)){const {leftover,day,key,tray,...bowl}=sl;
        pendL.push({bowl,tray,from:leftover?leftover.from:day,target:iso(firstSession(day,false))})}});
    dinner.forEach(sl=>{byKey[sl.key]={slot:sl,r};
      if(isSkip(sl.key))pendD.push({potKey:sl.potKey,from:sl.leftover?sl.leftover.from:sl.date,target:iso(firstSession(sl.date,true))})});
  }
  SIM={res,byKey};
}
function calc(s){
  const r=SIM.res[iso(s.date)];
  const eaten=r.lunch.filter(b=>!b.leftover);
  const allCooked=s.bowls.filter(b=>!b.noCook).length;
  const cooked=eaten.filter(b=>!b.noCook).length;
  const trayF=allCooked?cooked/allCooked:0;
  const potSlots=r.dinner.filter(d=>!d.leftover);
  const portions=potSlots.length;
  const tray=s.tray.map(([n,g])=>[n,Math.round(g*trayF/10)*10]).filter(t=>t[1]>0);
  return {eaten,cooked,tray,portions,potSlots,extras:s.extras,pot:POT[s.potKey],inL:r.inL,inD:r.inD};
}
function bowlNums(b){
  const ba=BASE[b.b],pr=PROT[b.p],sa=SAUCE[b.s];
  let k=ba.kcal+pr.kcal+(b.noCook?0:180)+sa.kcal,p=ba.p+pr.p+(b.noCook?0:6);
  b.f.forEach(f=>{k+=FRESH[f].kcal;p+=FRESH[f].p});
  return {kcal:Math.round(k/10)*10,p};
}
function mealsFor(d){
  d=sod(d);const dw=d.getDay();const out={lunch:{kind:'none'},dinner:{kind:'none'}};
  if(d<START)return out;
  if(dw===0)out.lunch={kind:'free'};
  else{const e=SIM.byKey[iso(d)+'|lunch'];if(e)out.lunch={kind:'bowl',bowl:e.slot,s:e.r.s}}
  const key=iso(d)+'|dinner';
  if(iso(d)==='2026-11-26'){out.dinner={kind:'quick',q:QUICK.friedrice,key};return out}
  if(dw===6){out.dinner={kind:'pasta',key};return out}
  const e=SIM.byKey[key];
  if(!e){if(dw===1||dw===4)out.dinner={kind:'freezer',pot:null,key};return out}
  const sl=e.slot,pot=POT[sl.potKey];
  if(sl.leftover)out.dinner={kind:'leftover',pot,from:sl.leftover.from,key};
  else if(sl.frozen)out.dinner={kind:'freezer',pot,key};
  else out.dinner={kind:'pot',pot,fresh:iso(e.r.s.date)===iso(d),key};
  return out;
}
function trayNames(s){return s.tray.map(t=>t[0].toLowerCase()).join(', ')}

/* ---------- shopping ---------- */
function shopping(s){
  const c=calc(s),map=new Map(),pantry=new Set(['Oil','Salt & pepper']);
  const addI=(x,f,forLabel)=>{const q=x.q*f;if(q<=0)return;const k=x.n+'|'+x.u;
    const e=map.get(k)||{n:x.n,u:x.u,s:x.s,q:0,for:new Set()};e.q+=q;if(forLabel)e.for.add(forLabel);map.set(k,e)};
  const sauces=new Set();
  c.eaten.forEach(b=>{const lbl=fmt(b.day,{weekday:'short'})+' lunch';
    BASE[b.b].items.forEach(x=>addI(x,1,lbl));PROT[b.p].items.forEach(x=>addI(x,1,lbl));
    b.f.forEach(f=>addI(FRESH[f],1,lbl));sauces.add(b.s)});
  c.tray.forEach(([n,g])=>addI(it(n,g,'g',TRAY_SEC[n]||'veg'),1,'veg tray'));
  sauces.forEach(k=>{const sa=SAUCE[k];sa.shop.forEach(x=>addI(x,1,sa.name+' sauce'));sa.pantry.forEach(p=>pantry.add(p))});
  if(c.portions){const f=c.portions/3;c.pot.items.forEach(x=>addI(x,f,c.pot.name));
    if(c.pot.riceG)addI(it('Jasmine rice',c.pot.riceG*c.portions,'g','dry'),1,c.pot.name);
    c.pot.pantry.forEach(p=>pantry.add(p))}
  c.extras.forEach(x=>{x.items.forEach(i=>addI(i,1,x.name));x.pantry.forEach(p=>pantry.add(p))});
  if(s.type==='sun'){FIXED_WEEK.forEach(x=>addI(x,1,'breakfast & shake'));FIXED_PANTRY.forEach(p=>pantry.add(p))}
  const groups={};SEC_ORDER.forEach(k=>groups[k]=[]);
  [...map.values()].forEach(e=>groups[e.s].push(e));
  SEC_ORDER.forEach(k=>groups[k].sort((a,b)=>a.n.localeCompare(b.n)));
  return {groups,pantry:[...pantry].sort(),c};
}
function amt(e){
  const q=e.q;
  if(e.u==='g'){if(q>=1000)return (Math.round(q/100)/10)+' kg';const g=q>=50?Math.round(q/10)*10:Math.round(q);
    return g+' g'+(APPROX[e.n]?` · ≈${Math.max(1,Math.round(q/APPROX[e.n]))}`:'')}
  if(e.u==='L')return q+' L';
  const n=Math.ceil(q-1e-9);
  if(e.u==='tin')return n+(n===1?' tin':' tins');
  if(e.u==='clove')return n+(n===1?' clove':' cloves');
  if(e.u==='bunch')return n+(n===1?' bunch':' bunches');
  if(e.u==='piece')return '1 piece';
  return String(n);
}
const frac=q=>{const w=Math.floor(q),r=Math.round((q-w)*4)/4;const fr={0:'',0.25:'¼',0.5:'½',0.75:'¾'}[r]??'';return (w?w:'')+(fr)||'0'};
function recipeAmt(x,f){
  const q=x.q*f;
  if(x.u==='g')return Math.round(q/10)*10+' g';
  if(x.u==='tin')return frac(q)+(q>1?' tins':' tin');
  if(x.u==='clove')return Math.max(1,Math.round(q))+' garlic clove'+(Math.round(q)>1?'s':'');
  if(x.u==='piece')return 'thumb of';
  return frac(q);
}

    <div class="progress" aria-hidden="true"><span style="width:${total?done/total*100:0}%"></span></div>
    ${rows}
    <div class="card"><div class="sec-t"><h3>Check you have</h3><span class="sub">buy if low</span></div>
      <div class="chips">${sh.pantry.map(p=>`<span class="chip">${p}</span>`).join('')}</div>
      ${firstSat?'<div class="sub">First shop of the month: also check rice, oats, protein powder, creatine, frozen prawns, frozen veg, tins and spices.</div>':''}</div>
  </div>`;
}

/* ---------- render: prep ---------- */
function renderPrep(){
  const s=session(prepS),c=calc(s),pot=c.pot;
  const rice={};
  c.eaten.forEach(b=>{const r=BASE[b.b].rice;if(r)rice[r]=(rice[r]||0)+100});
  if(c.portions&&pot.riceG)rice['Jasmine rice']=(rice['Jasmine rice']||0)+pot.riceG*c.portions;
  c.extras.forEach(()=>rice['Jasmine rice']=(rice['Jasmine rice']||0)+85);
  const pot_=c.eaten.filter(b=>BASE[b.b].potato).length*400;
  const prot={};c.eaten.forEach(b=>{prot[b.p]=(prot[b.p]||0)+1});
  const cookLines=[];
  if(prot.chicken)cookLines.push(`<b>${prot.chicken*150} g chicken breast:</b> oil, salt, paprika or garlic. 200–220°C, 18–22 min until no pink inside. Slice once cool.`);
  if(prot.salmon)cookLines.push(`<b>${prot.salmon*130} g salmon:</b> salt and lemon. 200°C, 12–15 min. Eat within 2 days.`);
  if(prot.tofu)cookLines.push(`<b>${prot.tofu*200} g tofu:</b> cube, toss with 1 tbsp soy and 1 tsp cornstarch. 220°C, 25 min.`);
  if(prot.halloumi)cookLines.push(`<b>${prot.halloumi*80} g halloumi:</b> pan-fry 2 min per side (or fry it fresh on the day).`);
  if(prot.eggs)cookLines.push(`<b>${prot.eggs*3} eggs:</b> boil 9 min, cool, keep in the shell.`);
  if(prot.smoked||prot.tuna||prot.chickfeta)cookLines.push('Smoked tofu, tuna and chickpeas need no cooking.');
  const sauces=[...new Set(c.eaten.map(b=>b.s))];
  const notes=[];
  const nx=mealsFor(add(s.date,1));
  if(nx.dinner.kind==='freezer'&&nx.dinner.pot&&!isSkip(nx.dinner.key))notes.push(`Move the frozen ${nx.dinner.pot.name.toLowerCase()} portion to the fridge for tomorrow.`);
  if(nx.lunch.kind==='bowl'&&nx.lunch.bowl.p==='prawns'&&!isSkip(nx.lunch.bowl.key))notes.push('Move 150 g prawns to the fridge for tomorrow\'s lunch.');
  if(c.extras.length)notes.push('Move 100 g prawns to the fridge for tomorrow\'s fried rice.');
  const f=c.portions/3;
  const potWhere=c.potSlots.map(d=>d.frozen?'freezer':isSkip(d.key)?`freezer (out ${fmt(d.date,{weekday:'long'})})`:fmt(d.date,{weekday:'long'})).join(', ');
  const carry=[...c.inL.map(x=>`<li><b>${x.bowl.style}</b> box (from ${fmt(x.from)})</li>`),...c.inD.map(x=>`<li><b>${POT[x.potKey].name}</b> portion (from ${fmt(x.from)})</li>`)];
  const outNow=[...SIM.res[iso(s.date)].lunch.filter(b=>isSkip(b.key)),...SIM.res[iso(s.date)].dinner.filter(d=>isSkip(d.key))].length;
  document.getElementById('v-prep').innerHTML=`
  <div class="wrap">
    <div class="head"><div><div class="eyebrow">${iso(s.date)===iso(TODAY)?'Today':fmt(s.date,{weekday:'long'})} · week ${s.week} of 3 · ~75 min</div><h1>Prep ${fmt(s.date,{day:'numeric',month:'long'})}</h1></div>
      <div class="navbtns"><button class="icon-btn" data-prep="-1" aria-label="Previous prep" ${prevSession(prepS)>=START?'':'disabled'}>‹</button><button class="icon-btn" data-prep="1" aria-label="Next prep">›</button></div></div>
    ${carry.length?`<div class="note"><b>Already in the freezer, so cooking less</b><ul>${carry.join('')}</ul></div>`:''}
    ${outNow?`<div class="note"><span>${outNow} ${outNow===1?'meal':'meals'} from this prep marked as eating out. Cook as normal and freeze ${outNow===1?'that portion':'those portions'}. The next prep cooks less.</span></div>`:''}
    ${c.eaten.length||c.portions?'':'<div class="empty">Leftovers cover everything this prep would make. Nothing to cook.</div>'}
    ${Object.keys(rice).length?`<div class="card step"><h3>1. Start the rice</h3><ul>${Object.entries(rice).map(([k,v])=>`<li><b>${v} g</b> ${k.toLowerCase()} (dry)</li>`).join('')}</ul><div class="sub">Spread it out to cool after cooking and get it into the fridge within an hour.</div></div>`:''}
    ${c.tray.length||pot_?`<div class="card step"><h3>2. Oven to 220°C, veg trays</h3><ul>
      ${c.tray.length?`<li>${c.tray.map(([n,g])=>`<b>${g} g</b> ${n.toLowerCase()}`).join(', ')}, in 2–3 cm pieces with 2–3 tbsp oil and salt. 25–30 min, turn once.</li>`:''}
      ${pot_?`<li><b>${pot_} g</b> potatoes in cubes with 1 tbsp oil per 400 g. 30–35 min.</li>`:''}</ul></div>`:''}
    ${cookLines.length?`<div class="card step"><h3>3. Lunch protein</h3><ul>${cookLines.map(l=>`<li>${l}</li>`).join('')}</ul></div>`:''}
    ${c.portions?`<div class="card step"><h3>4. ${pot.name} · ${c.portions} portions</h3>
      <ul>${pot.items.map(x=>`<li><b>${recipeAmt(x,f)}</b> ${x.n.toLowerCase()}</li>`).join('')}${pot.riceG?`<li><b>${pot.riceG*c.portions} g</b> rice to serve (in step 1)</li>`:''}</ul>
      <details open><summary>Method</summary><ol>${pot.steps.map(x=>`<li>${x}</li>`).join('')}</ol></details>
      <div class="sub">Portions go to: ${potWhere}.</div></div>`:''}
    ${sauces.length?`<div class="card step"><h3>5. Sauces into jars</h3><ul>${sauces.map(k=>`<li><b>${SAUCE[k].name[0].toUpperCase()+SAUCE[k].name.slice(1)}:</b> ${SAUCE[k].r}</li>`).join('')}</ul></div>`:''}
    ${c.eaten.length?`<div class="card step"><h3>6. Pack the boxes</h3><ul>${c.eaten.map(b=>{const ba=BASE[b.b],pr=PROT[b.p];
      return `<li><b>${fmt(b.day,{weekday:'short'})}:</b> ${ba.q} ${ba.label.replace(' (dry weight)',' (cooked)')}${b.noCook?'':' + 300 g veg'} + ${pr.q} ${pr.label} + 2 tbsp ${SAUCE[b.s].name}. Fresh on the day: ${b.f.map(x=>FRESH[x].label).join(', ')}.</li>`}).join('')}</ul>
      <div class="sub">Keep sauce in a small jar or a corner of the box, fresh veg and avocado separate.</div></div>`:''}
    ${notes.length?`<div class="note"><b>Tonight</b>${notes.map(n=>`<span>${n}</span>`).join('')}</div>`:''}
  </div>`;
}

/* ---------- wiring ---------- */
function render(){
  buildSim(add([selDay,shopS,prepS].reduce((a,b)=>a>b?a:b),14));
  ['today','shop','prep'].forEach(v=>{document.getElementById('v-'+v).hidden=v!==view;document.getElementById('t-'+v).setAttribute('aria-selected',v===view)});
  if(view==='today')renderToday();else if(view==='shop')renderShop();else renderPrep();
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button');if(!t)return;
  if(t.dataset.view){view=t.dataset.view;render();window.scrollTo(0,0);return}
  if(t.dataset.day){const [y,m,d]=t.dataset.day.split('-').map(Number);selDay=D(y,m,d);render();return}
  if(t.dataset.wk){const nd=add(selDay,7*Number(t.dataset.wk));selDay=nd<START?START:nd;render();return}
  if(t.dataset.skip){const k=t.dataset.skip;if(store.skip[k])delete store.skip[k];else store.skip[k]=1;save();render();return}
  if(t.dataset.go){const [y,m,d]=t.dataset.sess.split('-').map(Number);const sd=D(y,m,d);if(t.dataset.go==='shop')shopS=sd;else prepS=sd;view=t.dataset.go;render();window.scrollTo(0,0);return}
  if(t.dataset.shop){shopS=Number(t.dataset.shop)>0?nextSession(shopS):prevSession(shopS);render();return}
  if(t.dataset.prep){prepS=Number(t.dataset.prep)>0?nextSession(prepS):prevSession(prepS);render();return}
  if(t.dataset.reset){const p=t.dataset.reset+'|';Object.keys(store.chk).forEach(k=>{if(k.startsWith(p))delete store.chk[k]});save();render();return}
});
document.addEventListener('change',e=>{
  const k=e.target.dataset&&e.target.dataset.chk;if(!k)return;
  if(e.target.checked)store.chk[k]=1;else delete store.chk[k];save();
  const row=e.target.closest('.row');if(row)row.classList.toggle('done',e.target.checked);
  const all=document.querySelectorAll('#v-shop [data-chk]'),dn=[...all].filter(x=>x.checked).length;
  const tl=document.querySelector('#v-shop .total .sub');if(tl)tl.textContent=`${dn} of ${all.length} in the basket`;
  const bar=document.querySelector('#v-shop .progress span');if(bar)bar.style.width=(all.length?dn/all.length*100:0)+'%';
});
render();
if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{})}
</script>
</body>
</html>
